name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PKHeX.Mac.slnx

      - name: Check formatting
        run: dotnet format PKHeX.Mac.slnx --verify-no-changes --no-restore --exclude upstream

      - name: Build
        run: dotnet build PKHeX.Mac.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PKHeX.Mac.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  package:
    name: Package PKHeX.app
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the bundle
        run: ./scripts/package-app.sh

      - name: Zip the bundle
        run: ditto -c -k --keepParent dist/PKHeX.app dist/PKHeX.app.zip

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: PKHeX.app
          path: dist/PKHeX.app.zip
